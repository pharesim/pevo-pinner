<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Motion lines -->
  <line x1="2" y1="30" x2="13" y2="30" stroke="#8BA83E" stroke-width="3" stroke-linecap="round"/>
  <line x1="4" y1="35" x2="14" y2="35" stroke="#8BA83E" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="40" x2="15" y2="40" stroke="#8BA83E" stroke-width="3" stroke-linecap="round"/>
  <!-- Snail head/body -->
  <ellipse cx="18" cy="37" rx="5" ry="6" fill="#8BA83E"/>
  <!-- Eye -->
  <circle cx="17" cy="35" r="2" fill="#546B1C"/>
  <circle cx="17" cy="35" r="0.8" fill="white"/>
  <!-- Shell - dark green donut (main ring) -->
  <circle cx="38" cy="30" r="22" fill="#6B8C23"/>
  <!-- Shell inner cutout -->
  <circle cx="38" cy="30" r="10" fill="white"/>
  <!-- Light green wedge (top-left quadrant of shell) -->
  <path d="M38,8 L38,30 L16,30 A22,22 0 0 1 38,8 Z" fill="#8BA83E"/>
  <!-- Inner cutout for wedge area too -->
  <circle cx="38" cy="30" r="10" fill="white"/>
  <!-- Segment lines (radial, from inner to outer edge) -->
  <line x1="38" y1="8" x2="38" y2="20" stroke="white" stroke-width="2"/>
  <line x1="53" y1="13" x2="46" y2="22" stroke="white" stroke-width="2"/>
  <line x1="60" y1="30" x2="48" y2="30" stroke="white" stroke-width="2"/>
  <line x1="53" y1="47" x2="46" y2="38" stroke="white" stroke-width="2"/>
  <line x1="38" y1="52" x2="38" y2="40" stroke="white" stroke-width="2"/>
  <line x1="23" y1="47" x2="30" y2="38" stroke="white" stroke-width="2"/>
</svg>
